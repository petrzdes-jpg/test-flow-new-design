<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="app-version" content="2026.09.30-dsflow.25">
  <title>Flow — Вход</title>
  <meta name="description" content="Flow — цифровой штаб строительства.">
  <meta name="application-name" content="Flow">
  <meta name="apple-mobile-web-app-title" content="Flow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1C4391">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32x32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <script src="flow/env.js?v=2"></script>
  <script src="assets/dsflow-auth.js?v=3"></script>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    :root{
      --bg:#060c18; --bg-2:#0a1428; --ink:#eef3fb; --ink-2:#93a1b8; --ink-3:#5f6d84;
      --line:rgba(170,195,235,.14); --line-2:rgba(170,195,235,.26);
      --accent:#1a7bf5; --accent-2:#3d95ff; --crit:#ff7b72;
      --ease:cubic-bezier(.22,.61,.36,1);
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased; overflow:hidden}


    main{position:relative; z-index:1; min-height:100%; display:grid; place-items:center;
      padding:max(32px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left))}
    .gate{width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; text-align:center}

    .mark{width:92px; height:92px; border-radius:26px; position:relative; opacity:0; transform:translateY(10px) scale(.94);
      animation:rise 1.1s var(--ease) .15s forwards}
    .mark img{display:block; width:100%; height:100%; border-radius:inherit}
    .mark::after{content:""; position:absolute; inset:-18px; border-radius:40px; border:1px solid rgba(90,160,255,.14);
      opacity:0; animation:halo 1.6s var(--ease) .7s forwards}
    .brand{margin:26px 0 0; font-size:40px; line-height:1; font-weight:750; letter-spacing:-.045em; opacity:0; animation:fadeUp .9s var(--ease) .45s forwards}
    .tagline{margin:12px 0 0; color:var(--ink-2); font-size:14.5px; letter-spacing:-.005em; opacity:0; animation:fadeUp .9s var(--ease) .6s forwards}

    form{width:100%; margin-top:44px; display:flex; flex-direction:column; gap:12px; opacity:0; animation:fadeUp .9s var(--ease) .78s forwards}
    .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
    .field{position:relative}
    .field input{width:100%; height:54px; padding:0 52px 0 18px; border-radius:15px; border:1px solid var(--line-2);
      background:rgba(255,255,255,.035); color:var(--ink); font:500 16px/1 Inter, system-ui, sans-serif; letter-spacing:.02em;
      outline:none; transition:border-color .2s, background .2s, box-shadow .2s; -webkit-appearance:none; appearance:none}
    .field input::placeholder{color:var(--ink-3); letter-spacing:0; font-weight:450}
    .field input:hover{border-color:rgba(170,195,235,.36)}
    .field input:focus{border-color:rgba(61,149,255,.75); background:rgba(255,255,255,.05); box-shadow:0 0 0 3px rgba(28,67,145,.22)}
    .field.err input{border-color:rgba(255,123,114,.75); box-shadow:0 0 0 4px rgba(255,123,114,.12)}
    .field.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
    .eye{position:absolute; right:8px; top:8px; width:38px; height:38px; border:0; border-radius:11px; background:transparent; color:var(--ink-3);
      display:grid; place-items:center; cursor:pointer; transition:color .2s, background .2s}
    .eye:hover{color:var(--ink); background:rgba(255,255,255,.06)}
    .eye:focus-visible{outline:2px solid var(--accent-2); outline-offset:1px}
    .eye svg{width:19px; height:19px}
    .eye .off{display:none} .eye[aria-pressed="true"] .on{display:none} .eye[aria-pressed="true"] .off{display:block}

    button.go{height:54px; border:0; border-radius:15px; background:var(--accent); color:#fff; font:650 15.5px/1 Inter, system-ui, sans-serif; letter-spacing:-.005em;
      cursor:pointer; position:relative; overflow:hidden; transition:background .2s, transform .15s, box-shadow .25s}
    button.go:hover{background:var(--accent-2)}
    button.go:active{transform:scale(.985)}
    button.go:focus-visible{outline:2px solid #fff; outline-offset:3px}
    button.go .lbl{transition:opacity .2s, transform .2s}
    button.go .spin{position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%;
      border:2px solid rgba(255,255,255,.35); border-top-color:#fff; opacity:0; animation:rot .8s linear infinite}
    button.go .ok{position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; opacity:0; transform:scale(.6)}
    button.go.busy .lbl, button.go.done .lbl{opacity:0; transform:translateY(-6px)}
    button.go.busy .spin{opacity:1}
    button.go.done .ok{opacity:1; transform:scale(1); transition:opacity .25s, transform .35s var(--ease)}
    button.go[disabled]{cursor:default}

    .msg{min-height:20px; margin:2px 0 0; color:var(--crit); font-size:13.5px; font-weight:550; opacity:0; transform:translateY(-3px); transition:opacity .25s, transform .25s}
    .msg.show{opacity:1; transform:none}

    footer{position:fixed; left:0; right:0; bottom:max(18px, env(safe-area-inset-bottom)); z-index:1; text-align:center; color:var(--ink-3); font-size:12px; letter-spacing:.02em;
      opacity:0; animation:fadeIn 1.2s var(--ease) 1.1s forwards}

    /* Переход после входа */
    body.leaving .gate{transition:opacity .55s var(--ease), transform .7s var(--ease), filter .55s; opacity:0; transform:translateY(-14px) scale(.985); filter:blur(4px)}
    body.leaving footer{transition:opacity .4s; opacity:0}

    @keyframes rise{to{opacity:1; transform:none}}
    @keyframes halo{0%{opacity:0; transform:scale(.9)} 60%{opacity:1} 100%{opacity:.7; transform:none}}
    @keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
    @keyframes fadeIn{to{opacity:1}}
    @keyframes shake{10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}}
    @keyframes rot{to{transform:rotate(360deg)}}
    @keyframes toLight{to{opacity:1}}

    /* Демо-режим: отдельный контур, неброская ссылка в нижнем левом углу */
    .demo-link{position:fixed; z-index:2; left:max(18px, env(safe-area-inset-left)); bottom:max(14px, env(safe-area-inset-bottom)); color:var(--ink-3); font-size:12.5px; font-weight:550;
      text-decoration:none; padding:7px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.02); opacity:0; animation:fadeIn 1.2s var(--ease) 1.2s forwards; transition:color .2s, border-color .2s, background .2s}
    .demo-link:hover{color:var(--ink); border-color:var(--line-2); background:rgba(255,255,255,.05)}
    .demo-link:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px}
    body.leaving .demo-link{transition:opacity .4s; opacity:0}
    @media (max-width:480px){ footer{left:auto; right:max(18px, env(safe-area-inset-right)); text-align:right} }
    @media (max-width:480px){
      .mark{width:80px; height:80px; border-radius:23px}
      .brand{font-size:36px; margin-top:22px}
      form{margin-top:36px}
    }
    @media (max-height:560px){ .gate{transform:scale(.92)} form{margin-top:28px} }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
    }
  </style>
  <link rel="stylesheet" href="flow/login-exp.css?v=1">
</head>
<body>
  <main>
    <div class="gate">
      <div class="mark"><img src="assets/icons/mark.svg" alt="" width="92" height="92"></div>
      <h1 class="brand">Flow</h1>
      <p class="tagline">Цифровой штаб строительства</p>
      <form id="login" novalidate autocomplete="on">
        <input type="text" name="username" value="dsflow" autocomplete="username" hidden aria-hidden="true" tabindex="-1">
        <div class="field" id="field">
          <label class="sr" for="pwd">Пароль</label>
          <input id="pwd" name="password" type="password" placeholder="Пароль" autocomplete="current-password" autocapitalize="off" spellcheck="false" enterkeyhint="go" required aria-describedby="msg">
          <button class="eye" id="eye" type="button" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19c1.8 0 3.4-.5 4.7-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <button class="go" id="go" type="submit"><span class="lbl">Войти</span><span class="spin" aria-hidden="true"></span>
          <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
      </form>
    </div>
  </main>
  <footer>Flow · цифровой штаб строительства</footer>
  <a class="demo-link" href="demo/login.html" title="Отдельный демонстрационный контур Flow: вымышленные объекты, вход под ролью">Демо-режим</a>
  <script>
  (function () {
    'use strict';
    var auth = window.DSFlowAuth;
    var form = document.getElementById('login'), pwd = document.getElementById('pwd'), field = document.getElementById('field');
    var go = document.getElementById('go'), msg = document.getElementById('msg'), eye = document.getElementById('eye');

    // Куда вернуться после входа: только адрес внутри Flow, по умолчанию — реальные проекты.
    function nextURL() {
      var base = new URL(auth.baseURL), def = base.href;
      try {
        var raw = new URLSearchParams(location.search).get('next');
        if (!raw) return def;
        var u = new URL(raw, base);
        if (u.origin !== base.origin || u.pathname.indexOf(base.pathname) !== 0 || /login\.html$/.test(u.pathname)) return def;
        return u.href;
      } catch (e) { return def; }
    }
    if (auth.isAuthed()) { location.replace(nextURL()); return; }

    setTimeout(function () { try { pwd.focus({ preventScroll: true }); } catch (e) {} }, 900);

    eye.addEventListener('click', function () {
      var show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      eye.setAttribute('aria-pressed', String(show));
      eye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
      eye.title = eye.getAttribute('aria-label');
      pwd.focus();
    });
    pwd.addEventListener('input', function () { field.classList.remove('err'); msg.classList.remove('show'); });

    var busy = false;
    function fail(text) {
      busy = false; go.classList.remove('busy'); go.disabled = false;
      msg.textContent = text; msg.classList.add('show');
      field.classList.add('err');
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      pwd.select();
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;
      if (!pwd.value) { fail('Введите пароль'); return; }
      busy = true; go.classList.add('busy'); go.disabled = true; msg.classList.remove('show');
      auth.login(pwd.value).then(function (res) {
        if (!res.ok) { fail(res.error || 'Неверный пароль'); return; }
        go.classList.remove('busy'); go.classList.add('done');
        try { sessionStorage.setItem('dsflow.enter', '1'); } catch (err) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(function () { document.body.classList.add('leaving'); }, reduce ? 0 : 280);
        setTimeout(function () { location.replace(nextURL()); }, reduce ? 60 : 1050);
      });
    });
  })();
  </script>
</body>
</html>
